<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Panel | Hindustan Rubber Products</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --surface-elevated: #1a1a1a;
      --border: #27272a;
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --input-bg: #09090b;
    }
  /* Base Reset */
  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
  }

  *::-webkit-scrollbar {
    display: none; /* Hide scrollbars for Safari and Chrome */
  }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
   html, body{touch-action: none; /* Prevents pull-to-refresh and bounce gestures */
    -webkit-text-size-adjust: none !important;
    text-size-adjust: none !important;
    -moz-text-size-adjust: none !important;
    -ms-text-size-adjust: none !important;
     user-select: none !important;
    -webkit-user-select: none !important;
    -ms-user-select: none !important;
    -moz-user-select: none !important;
    -webkit-touch-callout: none !important;
    caret-color: transparent !important;
  }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100dvh; display: flex; flex-direction: column; }
    .container { max-width: 800px; margin: 0 auto; padding: 24px 20px; width: 100%; }

    /* LOGIN SCREEN */
    #loginScreen { position: fixed; inset: 0; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    
    .login-box { 
      background: var(--surface); 
      border: 1px solid var(--border); 
      padding: 32px 24px; 
      border-radius: 16px; 
      width: 100%; 
      max-width: 400px; 
      text-align: center; 
      position: relative; /* For absolute positioning of close button */
    }

    .login-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 1.5rem;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: 0.2s;
    }
    
    /* 1. Round Circle Close Button */
    .login-close-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--surface-elevated); /* Adds a visible background */
      border: 1px solid var(--border); /* Adds the circle ring */
      color: var(--text-sub);
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%; /* Ensures it is a perfect circle */
      transition: 0.2s;
    }
    .login-box h2 { margin-bottom: 24px; font-weight: 800; margin-top: 8px; }
    .login-box input[type="password"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-size: 1rem; margin-bottom: 16px; outline: none; }
    .login-box input[type="password"]:focus { border-color: var(--accent); }
    
        .checkbox-container { 
      display: flex; 
      align-items: center; 
      justify-content: flex-start; 
      gap: 8px; 
      margin-bottom: 24px; 
      color: var(--text-sub); 
      font-size: 0.9rem; 
      cursor: pointer; 
      width: 100%; /* Forces container to take full width and align left */
    }

    .checkbox-container input[type="checkbox"] {
      margin: 0; /* Removes default browser spacing */
      width: 16px;
      height: 16px;
      accent-color: var(--accent); /* Matches your OLED theme */
      cursor: pointer;
    }

   .login-close-btn:hover { 
      background: var(--border); 
      color: var(--text-main); 
    }
    /* CONTACT SECTION IN LOGIN */
    .contact-section { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 20px; }
    /* 2. Contact Admin with Dashes on Both Sides */
    .contact-header { 
      font-size: 0.8rem; 
      color: var(--text-sub); 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.05em; 
      margin-bottom: 20px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
    }

    .contact-header::before, 
    .contact-header::after { 
      content: ""; 
      height: 1px; 
      width: 40px; 
      background-color: var(--border); 
    }.contact-buttons { display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }
    .dev-action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
    .icon-circle { width: 48px; height: 48px; border-radius: 50%; background: #20242a; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .dev-action-btn:active .icon-circle { background: #2d333b; }
    .icon-circle svg { width: 22px; height: 22px; fill: #ffffff; }
    .dev-action-btn > span { font-size: 0.75rem; color: var(--text-sub); font-weight: 500; }

    /* ADMIN DASHBOARD */
    #adminDashboard { display: none; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    header h1 { font-size: 1.3rem; font-weight: 800; }
    .nav-link { color: var(--text-sub); text-decoration: none; font-size: 0.85rem; font-weight: 600; background: var(--surface); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }
    
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
    .card h3 { font-size: 1.1rem; margin-bottom: 16px; color: var(--accent); font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media(min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .full-width { grid-column: span 2; } }
    
    label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; display: block; font-weight: 600; }
    input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-size: 0.95rem; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }
    
    .btn-primary { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
    
    .update-controls { margin-bottom: 16px; }
    .item-list { display: flex; flex-direction: column; gap: 12px; }
    .item-card { background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .item-name { font-size: 1.05rem; font-weight: 700; display: block;}
    .item-specs { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }
    .item-qty { font-size: 1.1rem; font-weight: 800; color: var(--accent); text-align: right; }
    
    .action-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .action-input { flex: 1; padding: 10px; font-size: 1rem; text-align: center; }
    .btn-add, .btn-issue { border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; color: #fff; cursor: pointer; flex: 1; }
    .btn-add { background: var(--success); }
    .btn-issue { background: var(--danger); }
    .btn-delete { background: transparent; border: none; color: var(--text-sub); font-size: 0.8rem; margin-top: 12px; text-decoration: underline; cursor: pointer; }
    .empty-state { text-align: center; padding: 24px; color: var(--text-sub); font-size: 0.9rem; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen">
    <div class="login-box">
      <!-- Close Button -->
      <button class="login-close-btn" onclick="closeLogin()">&#x2715;</button>
      
      <h2>Admin Login</h2>
      <input type="password" id="adminPwd" placeholder="Enter Password" onkeypress="handleEnter(event)" />
      
      <!-- Checkbox Left Aligned -->
      <label class="checkbox-container">
        <input type="checkbox" id="savePwd" /> Keep me logged in
      </label>
      
      <button class="login-btn" onclick="verifyLogin()">Login &rarr;</button>

      <!-- Contact Admin Section -->
      <div class="contact-section">
        <div class="contact-header">Contact Admin</div>
        <div class="contact-buttons">
          
          <!-- Call -->
          <span onclick="window.location.href='tel:+918210660831'" class="dev-action-btn">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24">
                <path d="M6.54 5c.06.89.21 1.76.45 2.59l-1.2 1.2c-.41-1.2-.67-2.47-.76-3.79h1.51m9.86 12.02c.85.24 1.72.39 2.6.45v1.49c-1.32-.09-2.59-.35-3.8-.75l1.2-1.19M7.5 3H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.49c0-.55-.45-1-1-1-1.24 0-2.45-.2-3.57-.57-.1-.04-.21-.05-.31-.05-.26 0-.51.1-.71.29l-2.2 2.2c-2.83-1.45-5.15-3.76-6.59-6.59l2.2-2.2c.28-.28.36-.67.25-1.02C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H7.5z"/>
              </svg>
            </div>
            <span>Call</span>
          </span>

          <!-- Message -->
          <span onclick="window.location.href='sms:+918210660831'" class="dev-action-btn">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24">
                <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/>
              </svg>
            </div>
            <span>Message</span>
          </span>

          <!-- Email -->
          <span onclick="window.location.href='mailto:besra.m9@gmail.com'" class="dev-action-btn">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24">
                <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
              </svg>
            </div>
            <span>Email</span>
          </span>

          <!-- WhatsApp -->
          <span onclick="window.location.href='https://wa.me/918210660831'" class="dev-action-btn">
            <div class="icon-circle">
              <svg viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
              </svg>
            </div>
            <span>WhatsApp</span>
          </span>

        </div>
      </div>
    </div>
  </div>

  <div class="container" id="adminDashboard">
    <header>
      <h1>Control Panel</h1>
      <a href="index.html" class="nav-link">&larr; User View</a>
    </header>

    <div class="card">
      <h3>+ Add New Stock Item</h3>
      <form id="addItemForm" onsubmit="handleAddItem(event)">
        <div class="form-grid">
          <div class="full-width">
            <label>Item Name</label>
            <input type="text" id="newName" placeholder="e.g. Nitrile Rubber (NBR)" required />
          </div>
          <div>
            <label>Category</label>
            <select id="newCategory" required>
              <option value="Polymer">Polymer</option>
              <option value="Chemical">Chemical</option>
              <option value="Filler">Filler</option>
              <option value="Oil">Oil</option>
            </select>
          </div>
          <div>
            <label>Unit Wt.(Kg)</label>
            <input type="number" step="0.01" id="newUnitWt" placeholder="e.g. 35" required />
          </div>
          <div class="full-width">
            <label>Initial Quantity</label>
            <input type="number" id="newQty" placeholder="Enter qty count" min="0" required />
          </div>
        </div>
        <button type="submit" class="btn-primary">Save New Item</button>
      </form>
    </div>

    <div class="card">
      <h3>&#x21C4; Update Existing Stock</h3>
      <div class="update-controls">
        <label>Select Category to View Items</label>
        <select id="filterCategory" onchange="renderUpdateList()">
          <option value="Polymer">Polymer</option>
          <option value="Chemical">Chemical</option>
          <option value="Filler">Filler</option>
          <option value="Oil">Oil</option>
        </select>
      </div>
      <div class="item-list" id="updateListContainer"></div>
    </div>
  </div>

  <script>
    const CORRECT_PWD = "admin123m";
    window.onload = () => {
      if (localStorage.getItem("hrp_admin_pwd") === CORRECT_PWD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
      }
    };
    
    // Close button logic
    function closeLogin() {
      window.location.href = 'index.html';
    }

    function handleEnter(e) { if (e.key === "Enter") verifyLogin(); }
    
    function verifyLogin() {
      const pwd = document.getElementById("adminPwd").value;
      if (pwd === CORRECT_PWD) {
        if (document.getElementById("savePwd").checked) localStorage.setItem("hrp_admin_pwd", pwd);
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
      } else { alert("Incorrect Password!"); }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBkMiak1gDsTaP22FBMYmTh7kwHnne1NIM",
      authDomain: "inventory-tracker-a6d75.firebaseapp.com",
      databaseURL: "https://inventory-tracker-a6d75-default-rtdb.firebaseio.com",
      projectId: "inventory-tracker-a6d75",
      storageBucket: "inventory-tracker-a6d75.firebasestorage.app",
      messagingSenderId: "498199087966",
      appId: "1:498199087966:web:e5d1d6454343d384091dcf"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allInventory = {};

    db.ref("inventory").on("value", (snapshot) => {
      allInventory = snapshot.val() || {};
      renderUpdateList();
    });

    function handleAddItem(e) {
      e.preventDefault();
      const name = document.getElementById("newName").value.trim();
      const category = document.getElementById("newCategory").value;
      const unitWt = parseFloat(document.getElementById("newUnitWt").value);
      const qty = parseInt(document.getElementById("newQty").value, 10);

      const exists = Object.values(allInventory).some(item => item.name.toLowerCase() === name.toLowerCase() && item.category === category);
      if (exists) { alert("This item already exists in the selected category!"); return; }

      db.ref("inventory").push({ name, category, unitWt, qty }).then(() => {
        document.getElementById("addItemForm").reset();
        document.getElementById("filterCategory").value = category;
        renderUpdateList();
      }).catch(err => alert("Error: " + err.message));
    }

    function renderUpdateList() {
      const container = document.getElementById("updateListContainer");
      const selectedCat = document.getElementById("filterCategory").value;
      container.innerHTML = "";

      const items = Object.entries(allInventory).filter(([key, item]) => item.category === selectedCat);
      if (items.length === 0) { container.innerHTML = `<div class="empty-state">No items found in ${selectedCat}.</div>`; return; }

      items.forEach(([key, item]) => {
        const card = document.createElement("div");
        card.className = "item-card";
        const unitWt = item.unitWt || 0;
        
        card.innerHTML = `
          <div class="item-header">
            <div>
              <span class="item-name">${item.name}</span>
              <div class="item-specs">Unit Wt: ${unitWt} Kg</div>
            </div>
            <div class="item-qty">Qty: ${item.qty}</div>
          </div>
          <div class="action-row">
            <input type="number" id="adj_${key}" class="action-input" placeholder="Qty Amount" min="1" />
            <button class="btn-add" onclick="adjustStock('${key}', 'add')">+ Add</button>
            <button class="btn-issue" onclick="adjustStock('${key}', 'issue')">- Issue</button>
          </div>
          <button class="btn-delete" onclick="deleteItem('${key}', '${item.name}')">Remove Item Completely</button>
        `;
        container.appendChild(card);
      });
    }

    function adjustStock(key, action) {
      const inputEl = document.getElementById(`adj_${key}`);
      const amount = parseInt(inputEl.value, 10);
      if (isNaN(amount) || amount <= 0) { alert("Enter a valid qty amount greater than 0."); return; }

      const item = allInventory[key];
      let newQty = item.qty;

      if (action === 'add') { newQty += amount; } 
      else if (action === 'issue') {
        if (amount > item.qty) { alert("Cannot issue more than current stock!"); return; }
        newQty -= amount;
      }
      db.ref("inventory/" + key).update({ qty: newQty }).then(() => { inputEl.value = ""; });
    }

    function deleteItem(key, name) {
      if (confirm(`WARNING: Permanently delete "${name}"?`)) db.ref("inventory/" + key).remove();
    }
  </script>
</body>
</html>
