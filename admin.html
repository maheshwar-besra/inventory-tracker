<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Admin Panel | Hindustan Rubber Products</title>
  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --surface-elevated: #1a1a1a;
      --border: #27272a;
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --accent: #38bdf8;
      --success: #10b981;
      --danger: #ef4444;
      --input-bg: #09090b;
    }
        /* Light Mode Variables for Admin */
    html[data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-elevated: #f1f5f9;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --input-bg: #ffffff;
    }

    /* Theme Toggle Button Styles */
    .header-actions { display: flex; gap: 12px; align-items: center; }
    
    .theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .theme-toggle:active { transform: scale(0.9); }
    .theme-toggle svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    
    * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  html, body {
    touch-action: none;
    -webkit-text-size-adjust: none !important;
    text-size-adjust: none !important;
    user-select: none !important;
    -webkit-user-select: none !important;
    background-color: var(--bg); 
    color: var(--text-main); 
    min-height: 100dvh; 
    display: flex; 
    flex-direction: column; 
  }

  .container { max-width: 800px; margin: 0 auto; padding: 24px 20px; width: 100%; }
    
  
  .container { max-width: 800px; margin: 0 auto; padding: 24px 20px; width: 100%; }

  /* LOGIN SCREEN */
  #loginScreen { position: fixed; inset: 0; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .login-box { background: var(--surface); border: 1px solid var(--border); padding: 24px 26px 24px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; position: relative; }
    .login-close-btn { 
    position: absolute; 
    bottom: -60px; /* Pushes it outside the bottom of the box */
    left: 50%; 
    transform: translateX(-50%); /* Centers it perfectly */
    background: var(--surface-elevated); 
    border: 1px solid var(--border); 
    color: var(--text-sub); 
    font-size: 1.2rem; 
    font-weight: bold; 
    cursor: pointer; 
    width: 40px; 
    height: 40px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    border-radius: 50%; 
    transition: 0.2s; 
  }
  .login-close-btn:hover { background: var(--border); color: var(--text-main); }
  .login-box h2 { margin-bottom: 24px; font-weight: 800; margin-top: 0px; }
  .login-box input[type="password"] { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-size: 1rem; margin-bottom: 16px; outline: none; }
  .login-box input[type="password"]:focus { border-color: var(--accent); }
  .checkbox-container { display: flex; align-items: center; justify-content: flex-start; gap: 8px; margin-bottom: 24px; color: var(--text-sub); font-size: 0.9rem; cursor: pointer; width: 100%; }
  .checkbox-container input[type="checkbox"] { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
  .login-btn { width: 100%; padding: 14px; border: none; border-radius: 8px; background: var(--accent); color: #000; font-size: 1rem; font-weight: 700; cursor: pointer; }

  /* CONTACT SECTION IN LOGIN */
  .contact-section { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 20px; }
  .contact-header { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .contact-header::before, .contact-header::after { content: ""; height: 1px; width: 40px; background-color: var(--border); }
  .contact-buttons { display: flex; justify-content: space-around; align-items: center; padding: 0 10px; }
  .dev-action-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; }
  .icon-circle { width: 48px; height: 48px; border-radius: 50%; background: #20242a; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
  .dev-action-btn:active .icon-circle { background: #2d333b; }
  .icon-circle svg { width: 22px; height: 22px; fill: #ffffff; }
  .dev-action-btn > span { font-size: 0.75rem; color: var(--text-sub); font-weight: 500; }

  /* ADMIN DASHBOARD */
  #adminDashboard { display: none; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  header h1 { font-size: 1.3rem; font-weight: 800; }
  .nav-link { color: var(--text-sub); text-decoration: none; font-size: 0.85rem; font-weight: 600; background: var(--surface); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); }
  
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 24px; }
  .card h3 { font-size: 1.1rem; margin-bottom: 16px; color: var(--accent); font-weight: 700; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  
  .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 12px; }
  @media(min-width: 600px) { .form-grid { grid-template-columns: 1fr 1fr; } .form-grid .full-width { grid-column: span 2; } }
  
  label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; display: block; font-weight: 600; }
  input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-size: 0.95rem; outline: none; }
  input[type="date"] { color-scheme: dark; } /* OLED date picker */
  input:focus, select:focus { border-color: var(--accent); }
  
  .btn-primary { background: var(--accent); color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
  
  .update-controls { margin-bottom: 16px; }
  .item-list { display: flex; flex-direction: column; gap: 12px; }
  .item-card { background: var(--surface-elevated); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .item-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .item-name { font-size: 1.05rem; font-weight: 700; display: block;}
  .item-specs { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px; }
  .item-qty { font-size: 1.1rem; font-weight: 800; color: var(--accent); text-align: right; }
  
  .action-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .btn-add, .btn-issue { border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; color: #fff; cursor: pointer; flex: 1; }
  .btn-add { background: var(--success); }
  .btn-issue { background: var(--danger); }
  .btn-delete { background: transparent; border: none; color: var(--text-sub); font-size: 0.8rem; margin-top: 12px; text-decoration: underline; cursor: pointer; display: block; width: 100%; text-align: center; padding: 8px 0; }
  .empty-state { text-align: center; padding: 24px; color: var(--text-sub); font-size: 0.9rem; }

  /* ADJUSTMENT MODAL POPUP */
  #adjModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; }
  .modal-box h3 { margin-bottom: 16px; font-size: 1.1rem; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .btn-cancel { background: var(--surface-elevated); color: var(--text-main); border: 1px solid var(--border); padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; }
  </style>

  <div class="container" id="adminDashboard">
        <header>
      <h1>Control Panel</h1>
      <div class="header-actions">
        <!-- Theme Toggle Button -->
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">
          <svg id="themeIcon" viewBox="0 0 24 24">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="javascript:void(0)" onclick="window.location.replace('index.html')" class="nav-link">&larr; User View</a>
      </div>
    </header>

    <div class="card">
      <h3>+ Add New Stock Item</h3>
      <form id="addItemForm" onsubmit="handleAddItem(event)">
        <div class="form-grid">
          <div class="full-width">
            <label>Item Name</label>
            <input type="text" id="newName" placeholder="e.g. Nitrile Rubber (NBR)" required />
          </div>
          <div>
            <label>Category</label>
            <select id="newCategory" required>
              <option value="Polymer">Polymer</option>
              <option value="Chemical">Chemical</option>
              <option value="Filler">Filler</option>
              <option value="Oil">Oil</option>
            </select>
          </div>
          <div>
            <label>Unit Wt.(Kg)</label>
            <input type="number" step="0.01" id="newUnitWt" placeholder="e.g. 35" required />
          </div>
          <div>
            <label>Date</label>
            <input type="date" id="newDate" required />
          </div>
          <div>
            <label>Initial Quantity</label>
            <input type="number" id="newQty" placeholder="Enter qty count" min="0" required />
          </div>
          <div class="full-width">
            <label>Supplier Name</label>
            <input type="text" id="newSupplier" placeholder="e.g. Reliance Polymers" required />
          </div>
        </div>
        <button type="submit" class="btn-primary">Save New Item & Log Transaction</button>
      </form>
    </div>

    <div class="card">
      <h3>&#x21C4; Update Existing Stock</h3>
      <div class="update-controls">
        <label>Select Category to View Items</label>
        <select id="filterCategory" onchange="renderUpdateList()">
          <option value="Polymer">Polymer</option>
          <option value="Chemical">Chemical</option>
          <option value="Filler">Filler</option>
          <option value="Oil">Oil</option>
        </select>
      </div>
      <div class="item-list" id="updateListContainer"></div>
    </div>

  <!-- POPUP MODAL FOR UPDATING TRANSACTIONS -->
  <div id="adjModal">
    <div class="modal-box">
      <h3 id="modalTitle">Adjust Stock</h3>
      <form id="adjForm" onsubmit="confirmAdjust(event)">
        <div class="form-grid">
          <div class="full-width">
            <label>Date</label>
            <input type="date" id="adjDate" required />
          </div>
          <div class="full-width">
            <label>Quantity Amount</label>
            <input type="number" id="adjQty" min="1" required />
          </div>
          <div class="full-width" id="supplierBox" style="display: none;">
            <label>Supplier Name</label>
            <input type="text" id="adjSupplier" placeholder="Who supplied this?" />
          </div>
        </div>
        <button type="submit" class="btn-primary" id="modalSubmitBtn">Confirm</button>
        <button type="button" class="btn-cancel" onclick="closeAdjModal()">Cancel</button>
      </form>
    </div>
  </div>

  <script>
    // Helper: Get today's date in YYYY-MM-DD
    function getToday() {
      return new Date().toISOString().split('T')[0];
    }
    document.getElementById("newDate").value = getToday();

    const CORRECT_PWD = "admin123m";
    window.onload = () => {
      if (localStorage.getItem("hrp_admin_pwd") === CORRECT_PWD) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
      }
    };
    
    function closeLogin() { window.location.replace('index.html'); }
    function handleEnter(e) { if (e.key === "Enter") verifyLogin(); }
    function verifyLogin() {
      const pwd = document.getElementById("adminPwd").value;
      if (pwd === CORRECT_PWD) {
        if (document.getElementById("savePwd").checked) localStorage.setItem("hrp_admin_pwd", pwd);
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("adminDashboard").style.display = "block";
      } else { alert("Incorrect Password!"); }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBkMiak1gDsTaP22FBMYmTh7kwHnne1NIM",
      authDomain: "inventory-tracker-a6d75.firebaseapp.com",
      databaseURL: "https://inventory-tracker-a6d75-default-rtdb.firebaseio.com",
      projectId: "inventory-tracker-a6d75",
      storageBucket: "inventory-tracker-a6d75.firebasestorage.app",
      messagingSenderId: "498199087966",
      appId: "1:498199087966:web:e5d1d6454343d384091dcf"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let allInventory = {};
    let currentAdjKey = null;
    let currentAdjAction = null;

    db.ref("inventory").on("value", (snapshot) => {
      allInventory = snapshot.val() || {};
      renderUpdateList();
    });

    function handleAddItem(e) {
      e.preventDefault();
      const name = document.getElementById("newName").value.trim();
      const category = document.getElementById("newCategory").value;
      const unitWt = parseFloat(document.getElementById("newUnitWt").value);
      const qty = parseInt(document.getElementById("newQty").value, 10);
      const dateStr = document.getElementById("newDate").value;
      const supplier = document.getElementById("newSupplier").value.trim();

      const exists = Object.values(allInventory).some(item => item.name.toLowerCase() === name.toLowerCase() && item.category === category);
      if (exists) { alert("This item already exists in the selected category!"); return; }

      // Generate history log for the initial opening stock
      const historyLog = {};
      const newPushKey = db.ref().push().key; // temporary key for array emulation
      historyLog[newPushKey] = {
        type: 'add',
        amount: qty,
        date: dateStr,
        supplier: supplier,
        timestamp: Date.now()
      };

      db.ref("inventory").push({ 
        name: name, 
        category: category, 
        unitWt: unitWt, 
        qty: qty,
        history: historyLog
      }).then(() => {
        document.getElementById("addItemForm").reset();
        document.getElementById("newDate").value = getToday(); // reset date
        document.getElementById("filterCategory").value = category;
        renderUpdateList();
      }).catch(err => alert("Error: " + err.message));
    }

    function renderUpdateList() {
      const container = document.getElementById("updateListContainer");
      const selectedCat = document.getElementById("filterCategory").value;
      container.innerHTML = "";

      const items = Object.entries(allInventory).filter(([key, item]) => item.category === selectedCat);
      if (items.length === 0) { container.innerHTML = `<div class="empty-state">No items found in ${selectedCat}.</div>`; return; }

      items.forEach(([key, item]) => {
        const card = document.createElement("div");
        card.className = "item-card";
        const unitWt = item.unitWt || 0;
        
        card.innerHTML = `
          <div class="item-header">
            <div>
              <span class="item-name">${item.name}</span>
              <div class="item-specs">Unit Wt: ${unitWt} Kg</div>
            </div>
            <div class="item-qty">Qty: ${item.qty}</div>
          </div>
          <div class="action-row">
            <button class="btn-add" onclick="openAdjModal('${key}', 'add')">+ Add Stock</button>
            <button class="btn-issue" onclick="openAdjModal('${key}', 'issue')">- Issue</button>
          </div>
          <button class="btn-delete" onclick="deleteItem('${key}', '${item.name}')">Remove Item Completely</button>
        `;
        container.appendChild(card);
      });
    }

    // Opens the Modal for Adjusting Stock
    function openAdjModal(key, action) {
      currentAdjKey = key;
      currentAdjAction = action;
      
      document.getElementById("adjDate").value = getToday();
      document.getElementById("adjQty").value = "";
      document.getElementById("adjSupplier").value = "";
      
      const supplierBox = document.getElementById("supplierBox");
      const modalTitle = document.getElementById("modalTitle");
      const submitBtn = document.getElementById("modalSubmitBtn");
      
      if(action === 'add') {
        supplierBox.style.display = "block";
        document.getElementById("adjSupplier").required = true;
        modalTitle.innerText = "Log Added Stock";
        modalTitle.style.color = "var(--success)";
        submitBtn.style.background = "var(--success)";
      } else {
        supplierBox.style.display = "none";
        document.getElementById("adjSupplier").required = false;
        modalTitle.innerText = "Log Issued Stock";
        modalTitle.style.color = "var(--danger)";
        submitBtn.style.background = "var(--danger)";
      }
      
      document.getElementById("adjModal").style.display = "flex";
    }

    function closeAdjModal() {
      document.getElementById("adjModal").style.display = "none";
    }

    // Handle form submit from the modal
    function confirmAdjust(e) {
      e.preventDefault();
      
      const amount = parseInt(document.getElementById("adjQty").value, 10);
      const dateStr = document.getElementById("adjDate").value;
      const supplier = document.getElementById("adjSupplier").value.trim();
      
      const item = allInventory[currentAdjKey];
      let newQty = item.qty;

      if (currentAdjAction === 'add') { 
        newQty += amount; 
      } else if (currentAdjAction === 'issue') {
        if (amount > item.qty) { alert("Cannot issue more than current stock!"); return; }
        newQty -= amount;
      }
      
      // We will perform a multi-path update in Firebase to update both Qty and the History Log simultaneously
      const updates = {};
      updates["/qty"] = newQty;
      
      // Generate unique key for this history entry
      const histKey = db.ref("inventory/" + currentAdjKey + "/history").push().key;
      updates["/history/" + histKey] = {
        type: currentAdjAction,
        amount: amount,
        date: dateStr,
        supplier: currentAdjAction === 'add' ? supplier : "-",
        timestamp: Date.now()
      };

      db.ref("inventory/" + currentAdjKey).update(updates).then(() => { 
        closeAdjModal();
      }).catch(err => alert("Error: " + err.message));
    }

    function deleteItem(key, name) {
      if (confirm(`WARNING: Permanently delete "${name}"? This removes all history too.`)) {
        db.ref("inventory/" + key).remove();
      }
    }
  </script>
  
   <script>
    // Theme Toggle Logic
    const themeIcon = document.getElementById('themeIcon');
    const currentTheme = localStorage.getItem('appTheme') || 'dark';

    // Apply saved theme on load (Applies to Login Screen too!)
    if (currentTheme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      setSunIcon();
    }

    function toggleTheme() {
      const html = document.documentElement;
      const isLight = html.getAttribute('data-theme') === 'light';
      
      if (isLight) {
        html.removeAttribute('data-theme');
        localStorage.setItem('appTheme', 'dark');
        setMoonIcon();
      } else {
        html.setAttribute('data-theme', 'light');
        localStorage.setItem('appTheme', 'light');
        setSunIcon();
      }
    }

    function setSunIcon() {
      if(themeIcon) themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
    }
    function setMoonIcon() {
      if(themeIcon) themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
    }
   </script>
