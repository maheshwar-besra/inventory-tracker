<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hindustan Rubber Products | Categories</title>
  <style>
    :root {
      --bg: #ffffff;
      --circle-border: #2c3444;
      --text-main: #111827;
      --text-sub: #6b7280;
      --icon-bg: #f0f4f9;
      --accent: #2563eb;
      --sheet-bg: #ffffff;
      --border-light: #e5e7eb;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
    }

    .viewport {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 20px;
      justify-content: space-between;
    }

    /* Header styling */
    header {
      text-align: center;
      padding: 6px 0 10px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 2px;
      font-weight: 500;
    }

    /* 2x2 Circular Category Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px 18px;
      align-content: center;
      justify-items: center;
      width: 100%;
      flex: 1;
    }

    .category-circle {
      width: 100%;
      max-width: 165px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      border: 2px solid var(--circle-border);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 12px;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .category-circle:active {
      transform: scale(0.95);
      border-color: var(--accent);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
    }

    /* Inner soft rounded icon container */
    .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .icon-wrapper svg {
      width: 26px;
      height: 26px;
    }

    .cat-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    .cat-desc {
      font-size: 0.72rem;
      color: var(--text-sub);
      margin-top: 3px;
      line-height: 1.2;
      font-weight: 500;
    }

    /* Footer Navigation */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px solid #f1f5f9;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .admin-link {
      font-size: 0.8rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    /* Bottom Modal / Sheet for Selected Category Stock */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      display: none;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .sheet-overlay.active {
      display: flex;
      opacity: 1;
    }

    .sheet {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      background: var(--sheet-bg);
      border-radius: 24px 24px 0 0;
      max-height: 80dvh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 -10px 25px rgba(0,0,0,0.15);
    }

    .sheet-overlay.active .sheet {
      transform: translateY(0);
    }

    .sheet-handle-bar {
      width: 40px;
      height: 4px;
      background: #cbd5e1;
      border-radius: 9999px;
      margin: 10px auto 4px;
    }

    .sheet-header {
      padding: 12px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
    }

    .sheet-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #0f172a;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f1f5f9;
      border: none;
      font-size: 1.1rem;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      padding: 0;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #f8fafc;
      padding: 10px 20px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-light);
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.95rem;
    }

    .item-name {
      font-weight: 600;
      color: #1e293b;
    }

    .item-qty {
      font-weight: 700;
      color: var(--accent);
    }

    .item-unit {
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
    }
  </style>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="viewport">
    <header>
      <h1>Hindustan Rubber Products</h1>
      <div class="subtitle">Stock Material - Dashboard</div>
    </header>

    <!-- 2x2 Exact Categories -->
    <div class="grid-container">
      
      <!-- 1. Polymer -->
      <div class="category-circle" onclick="openCategorySheet('Polymer')">
        <div class="icon-wrapper">
          <!-- Test Tube SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 2v17.5c0 1.4-1.1 2.5-2.5 2.5s-2.5-1.1-2.5-2.5V2" />
            <path d="M8.5 2h7" />
            <path d="M14.5 16h-5" />
          </svg>
        </div>
        <div class="cat-title">Polymer</div>
        <div class="cat-desc">Rubber &amp; Polymers</div>
      </div>

      <!-- 2. Chemical -->
      <div class="category-circle" onclick="openCategorySheet('Chemical')">
        <div class="icon-wrapper">
          <!-- Flask on stand SVG -->
          <svg viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6" />
            <path d="M10 9V3" />
            <path d="M14 9V3" />
            <path d="M6 19a4 4 0 0 0 4 2h4a4 4 0 0 0 4-2l-3-10H9L6 19z" />
          </svg>
        </div>
        <div class="cat-title">Chemical</div>
        <div class="cat-desc">Processing Chemicals</div>
      </div>

      <!-- 3. Filler -->
      <div class="category-circle" onclick="openCategorySheet('Filler')">
        <div class="icon-wrapper">
          <!-- Carbon / Mineral Dot SVG -->
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="7" fill="#334155" />
          </svg>
        </div>
        <div class="cat-title">Filler</div>
        <div class="cat-desc">Carbon &amp; Fillers</div>
      </div>

      <!-- 4. Oil -->
      <div class="category-circle" onclick="openCategorySheet('Oil')">
        <div class="icon-wrapper">
          <!-- Water/Oil Drop SVG -->
          <svg viewBox="0 0 24 24" fill="#0ea5e9">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z" />
          </svg>
        </div>
        <div class="cat-title">Oil</div>
        <div class="cat-desc">Process Oils</div>
      </div>

    </div>

    <footer>
      <div class="status-badge">
        <span class="live-dot"></span>
        <span>Live Cloud Sync</span>
      </div>
      <a href="admin.html" class="admin-link">Admin Dispatch &rarr;</a>
    </footer>
  </div>

  <!-- Bottom Sheet for Inventory Table on Tap -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
    <div class="sheet">
      <div class="sheet-handle-bar"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="sheetTitle">Stock List</div>
        <button type="button" class="close-btn" onclick="closeSheetDirect()">&times;</button>
      </div>
      <div class="sheet-body">
        <table>
          <thead>
            <tr>
              <th>Rubber Name</th>
              <th>Qty</th>
              <th>Unit</th>
            </tr>
          </thead>
          <tbody id="sheetTableBody"></tbody>
        </table>
        <div id="noItemsMessage" class="empty-state">No stock available for this category.</div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBkMiak1gDsTaP22FBMYmTh7kwHnne1NIM",
      authDomain: "inventory-tracker-a6d75.firebaseapp.com",
      databaseURL: "https://inventory-tracker-a6d75-default-rtdb.firebaseio.com",
      projectId: "inventory-tracker-a6d75",
      storageBucket: "inventory-tracker-a6d75.firebasestorage.app",
      messagingSenderId: "498199087966",
      appId: "1:498199087966:web:e5d1d6454343d384091dcf"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allInventory = {};
    let activeCategory = null;

    db.ref("inventory").on("value", (snapshot) => {
      allInventory = snapshot.val() || {};
      if (activeCategory) {
        renderTableData(activeCategory);
      }
    });

    function openCategorySheet(categoryName) {
      activeCategory = categoryName;
      document.getElementById("sheetTitle").innerText = categoryName + " Stock";
      renderTableData(categoryName);
      
      const overlay = document.getElementById("sheetOverlay");
      overlay.style.display = "flex";
      setTimeout(() => overlay.classList.add("active"), 10);
    }

    function renderTableData(categoryName) {
      const tbody = document.getElementById("sheetTableBody");
      const noItems = document.getElementById("noItemsMessage");
      tbody.innerHTML = "";

      const rawItems = Object.values(allInventory);
      const filtered = rawItems.filter(item => 
        (item.category || "").trim().toLowerCase() === categoryName.toLowerCase()
      );

      if (filtered.length === 0) {
        noItems.style.display = "block";
        return;
      }
      noItems.style.display = "none";

      filtered.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><span class="item-name">${item.name || "-"}</span></td>
          <td class="item-qty">${item.qty ?? 0}</td>
          <td><span class="item-unit">${item.unit || "Kg"}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    function closeSheetDirect() {
      const overlay = document.getElementById("sheetOverlay");
      overlay.classList.remove("active");
      setTimeout(() => {
        overlay.style.display = "none";
        activeCategory = null;
      }, 200);
    }

    function closeSheet(event) {
      if (event.target.id === "sheetOverlay") {
        closeSheetDirect();
      }
    }
  </script>
</body>
</html>
