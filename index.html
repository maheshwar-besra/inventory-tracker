<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hindustan Rubber Products | OLED Dashboard</title>
  <style>
    :root {
      /* OLED Theme Colors */
      --bg: #000000;
      --surface: #121212;
      --surface-elevated: #1a1a1a;
      --border: #27272a;
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Lock body to viewport height to strictly prevent scrolling */
    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text-main);
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 20px;
      justify-content: space-between;
    }

    /* Typography & Header */
    header {
      text-align: center;
      padding-bottom: 10px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }

    /* 2x2 Square Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      width: 100%;
      flex: 1;
      align-content: center;
      justify-items: center;
    }

    /* Square style with small round corners */
    .category-card {
      width: 100%;
      max-width: 170px;
      aspect-ratio: 1 / 1;
      border-radius: 16px; /* Small rounded corners */
      background-color: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 16px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .category-card:active {
      transform: scale(0.96);
      background-color: var(--surface-elevated);
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: var(--surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .icon-wrapper svg {
      width: 24px;
      height: 24px;
    }

    .cat-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .cat-desc {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-weight: 500;
    }

    /* Footer */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-sub);
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .admin-link {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-decoration: none;
      font-weight: 600;
      padding: 6px 12px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    /* Bottom Modal (Sheet) for displaying data without scrolling the main page */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      display: none;
      align-items: flex-end;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .sheet-overlay.active {
      display: flex;
      opacity: 1;
    }

    .sheet {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      background: #09090b; /* Very dark zinc */
      border-radius: 24px 24px 0 0;
      border-top: 1px solid var(--border);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      max-height: 75dvh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sheet-overlay.active .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      margin: 12px auto;
    }

    .sheet-header {
      padding: 4px 20px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .sheet-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .close-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .sheet-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 24px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #09090b;
      padding: 14px 20px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--surface-elevated);
    }

    .item-name {
      font-weight: 600;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .item-qty {
      font-weight: 700;
      color: var(--accent);
      font-size: 1rem;
    }

    .item-unit {
      color: var(--text-sub);
      font-size: 0.8rem;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-sub);
      font-size: 0.9rem;
    }
  </style>

  <!-- Firebase App and Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Hindustan Rubber Products</h1>
      <div class="subtitle">Stock Material &bull; Dashboard</div>
    </header>

    <!-- 2x2 Square Grid -->
    <div class="grid-container">
      
      <!-- Polymer -->
      <div class="category-card" onclick="openCategorySheet('Polymer')">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 2v7.31"></path>
            <path d="M14 9.3V1.99"></path>
            <path d="M8.5 2h7"></path>
            <path d="M14 9.3a6.5 6.5 0 1 1-4 0"></path>
            <path d="M5.52 16h12.96"></path>
          </svg>
        </div>
        <div class="cat-title">Polymer</div>
        <div class="cat-desc">Rubbers & Polymers</div>
      </div>

      <!-- Chemical -->
      <div class="category-card" onclick="openCategorySheet('Chemical')">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6"></path>
            <path d="M10 9V3"></path>
            <path d="M14 9V3"></path>
            <path d="M6 19a4 4 0 0 0 4 2h4a4 4 0 0 0 4-2l-3-10H9L6 19z"></path>
          </svg>
        </div>
        <div class="cat-title">Chemical</div>
        <div class="cat-desc">Processing Chemicals</div>
      </div>

      <!-- Filler -->
      <div class="category-card" onclick="openCategorySheet('Filler')">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <path d="M3 9h18"></path>
            <path d="M9 21V9"></path>
          </svg>
        </div>
        <div class="cat-title">Filler</div>
        <div class="cat-desc">Carbon & Fillers</div>
      </div>

      <!-- Oil -->
      <div class="category-card" onclick="openCategorySheet('Oil')">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"></path>
          </svg>
        </div>
        <div class="cat-title">Oil</div>
        <div class="cat-desc">Process Oils</div>
      </div>

    </div>

    <footer>
      <div class="status-badge">
        <span class="live-dot"></span>
        <span>LIVE SYNC</span>
      </div>
      <a href="admin.html" class="admin-link">Admin &rarr;</a>
    </footer>
  </div>

  <!-- Bottom Sheet Modal for Table View -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet(event)">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="sheetTitle">Category Stock</div>
        <button type="button" class="close-btn" onclick="closeSheetDirect()">&times;</button>
      </div>
      <div class="sheet-body">
        <table>
          <thead>
            <tr>
              <th>Material Name</th>
              <th>Qty</th>
              <th>Unit</th>
            </tr>
          </thead>
          <tbody id="sheetTableBody"></tbody>
        </table>
        <div id="noItemsMessage" class="empty-state">No stock available.</div>
      </div>
    </div>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBkMiak1gDsTaP22FBMYmTh7kwHnne1NIM",
      authDomain: "inventory-tracker-a6d75.firebaseapp.com",
      databaseURL: "https://inventory-tracker-a6d75-default-rtdb.firebaseio.com",
      projectId: "inventory-tracker-a6d75",
      storageBucket: "inventory-tracker-a6d75.firebasestorage.app",
      messagingSenderId: "498199087966",
      appId: "1:498199087966:web:e5d1d6454343d384091dcf"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allInventory = {};
    let activeCategory = null;

    // Listen for Realtime Updates
    db.ref("inventory").on("value", (snapshot) => {
      allInventory = snapshot.val() || {};
      if (activeCategory) {
        renderTableData(activeCategory);
      }
    });

    // Handle Modal Open
    function openCategorySheet(categoryName) {
      activeCategory = categoryName;
      document.getElementById("sheetTitle").innerText = categoryName + " Stock";
      renderTableData(categoryName);
      
      const overlay = document.getElementById("sheetOverlay");
      overlay.style.display = "flex";
      // Slight delay to allow display block to render before opacity transition
      setTimeout(() => overlay.classList.add("active"), 10);
    }

    // Render Data into Modal Table
    function renderTableData(categoryName) {
      const tbody = document.getElementById("sheetTableBody");
      const noItems = document.getElementById("noItemsMessage");
      tbody.innerHTML = "";

      const rawItems = Object.values(allInventory);
      const filtered = rawItems.filter(item => 
        (item.category || "").trim().toLowerCase() === categoryName.toLowerCase()
      );

      if (filtered.length === 0) {
        noItems.style.display = "block";
        return;
      }
      noItems.style.display = "none";

      filtered.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><span class="item-name">${item.name || "-"}</span></td>
          <td class="item-qty">${item.qty ?? 0}</td>
          <td><span class="item-unit">${item.unit || "Kg"}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    // Close Modals
    function closeSheetDirect() {
      const overlay = document.getElementById("sheetOverlay");
      overlay.classList.remove("active");
      setTimeout(() => {
        overlay.style.display = "none";
        activeCategory = null;
      }, 300); // Matches CSS transition time
    }

    function closeSheet(event) {
      if (event.target.id === "sheetOverlay") {
        closeSheetDirect();
      }
    }
  </script>
</body>
</html>
